<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karty z pytaniami do druku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Fredoka:wght@600;700&display=swap">
<link rel="stylesheet" href="karty-pytan.css">
<!--
  Karty z pytaniami w formacie karty do pokera (63 × 88 mm).
  Na awersie 7 pytań ABCD, na rewersie klucz odpowiedzi.
  Dane i wygląd kart są w karty-pytan.js i karty-pytan.css (te same pliki używa gra).

  Tryby druku (dopisz do adresu):
    ?tryb=a4         arkusze A4 do drukarki w domu: 9 kart na stronie, linie cięcia,
                     strona z rewersami ułożona lustrzanie do druku dwustronnego (domyślny)
    ?tryb=drukarnia  każda strona karty osobno, 69 × 94 mm (z 3 mm spadu na docięcie)
-->
<style id="page-size">@page { size: A4; margin: 0; }</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1E2A47; }

  /* arkusz A4 */
  .sheet { position: relative; width: 210mm; height: 297mm; overflow: hidden; break-after: page; background: #fff; }
  .sheet:last-child { break-after: auto; }
  .grid { position: absolute; left: 10.5mm; top: 16.5mm; display: grid; grid-template-columns: repeat(3, 63mm); grid-template-rows: repeat(3, 88mm); }
  .mark { position: absolute; background: #8A93A8; }
  .sheet-label { position: absolute; left: 10.5mm; bottom: 6mm; font: 600 7pt "Figtree", sans-serif; color: #8A93A8; }

  /* tryb drukarni */
  .cardpage { break-after: page; }
  .cardpage:last-child { break-after: auto; }

  /* podgląd na ekranie */
  @media screen {
    body { background: #E7EBF2; padding: 28px 20px 48px; }
    /* wersja do druku leży poza ekranem, ale ma układ, więc dopasowanie czcionki działa też dla niej */
    .print-only { position: absolute; left: -10000px; top: 0; }
    .intro { max-width: 900px; margin: 0 auto 26px; }
    .intro h1 { margin: 0 0 6px; font: 700 26px/1.15 "Fredoka", sans-serif; }
    .intro p { margin: 4px 0; color: #4A5570; font-size: 14.5px; line-height: 1.5; max-width: 70ch; }
    .preview { max-width: 900px; margin: 0 auto; display: grid; gap: 28px; }
    .pair { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .pair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pair figcaption { font: 600 13px "Figtree", sans-serif; color: #4A5570; }
    .zoom { zoom: 2.6; box-shadow: 0 2px 8px rgba(20, 30, 50, .18); border-radius: 1.2mm; overflow: hidden; }
    .warn { max-width: 900px; margin: 0 auto 18px; padding: 10px 14px; border-radius: 10px; background: #FFF1E6; color: #8A4413; font-size: 14px; }
  }
  @media screen and (max-width: 560px) { .zoom { zoom: 1.6; } }
  @media print { .screen-only { display: none !important; } }
</style>
</head>
<body>

<section class="intro screen-only">
  <h1>Karty z pytaniami</h1>
  <p>Format karty do pokera: 63 × 88 mm. Na awersie jest 7 pytań z odpowiedziami ABCD, nazwa przedmiotu, wykładowca i numer karty. Na rewersie jest klucz odpowiedzi dla osoby, która czyta pytanie.</p>
  <p>Kolor paska oznacza semestr, więc wydrukowane karty łatwo rozdzielić na kategorie.</p>
</section>
<div class="warn screen-only" id="warn" hidden></div>
<section class="preview screen-only" id="preview"></section>
<main class="print-only" id="print"></main>

<script src="karty-pytan.js"></script>
<script>
const { KARTY, awers, rewers, sprawdz, dopasuj, nr3, esc } = window.KartyPytan;

// Podgląd na ekranie
document.getElementById('preview').innerHTML = KARTY.map(k => `
  <div class="pair">
    <figure><div class="zoom">${awers(k)}</div><figcaption>Karta ${nr3(k.nr)}: awers</figcaption></figure>
    <figure><div class="zoom">${rewers(k)}</div><figcaption>Karta ${nr3(k.nr)}: rewers</figcaption></figure>
  </div>`).join('');

// Wersja do druku
const tryb = new URLSearchParams(location.search).get('tryb') === 'drukarnia' ? 'drukarnia' : 'a4';
const druk = document.getElementById('print');
if (tryb === 'drukarnia') {
  document.documentElement.style.setProperty('--qc-b', '3mm');
  document.getElementById('page-size').textContent = '@page { size: 69mm 94mm; margin: 0; }';
  druk.innerHTML = KARTY.map(k => `<div class="cardpage">${awers(k)}</div><div class="cardpage">${rewers(k)}</div>`).join('');
} else {
  const znaczniki = () => {
    const xs = [10.5, 73.5, 136.5, 199.5], ys = [16.5, 104.5, 192.5, 280.5];
    let h = '';
    for (const x of xs) {
      h += `<i class="mark" style="left:${x - 0.1}mm;top:9mm;width:.2mm;height:5.5mm"></i>`;
      h += `<i class="mark" style="left:${x - 0.1}mm;top:282.5mm;width:.2mm;height:5.5mm"></i>`;
    }
    for (const y of ys) {
      h += `<i class="mark" style="top:${y - 0.1}mm;left:3mm;width:5.5mm;height:.2mm"></i>`;
      h += `<i class="mark" style="top:${y - 0.1}mm;left:201.5mm;width:5.5mm;height:.2mm"></i>`;
    }
    return h;
  };
  // Rewersy w lustrzanej kolejności kolumn, żeby przy druku dwustronnym trafiły na tył awersów
  const miejsce = (i, lustro) => `grid-row:${Math.floor(i / 3) + 1};grid-column:${lustro ? 3 - (i % 3) : (i % 3) + 1}`;
  let html = '';
  for (let s = 0; s < KARTY.length; s += 9) {
    const partia = KARTY.slice(s, s + 9);
    const strona = Math.floor(s / 9) + 1;
    html += `<section class="sheet"><div class="grid">${partia.map((k, i) => `<div style="${miejsce(i, false)}">${awers(k)}</div>`).join('')}</div>${znaczniki()}<div class="sheet-label">Arkusz ${strona} · awersy · drukuj w skali 100%</div></section>`;
    html += `<section class="sheet"><div class="grid">${partia.map((k, i) => `<div style="${miejsce(i, true)}">${rewers(k)}</div>`).join('')}</div>${znaczniki()}<div class="sheet-label">Arkusz ${strona} · rewersy · druk dwustronny, obracanie wzdłuż dłuższej krawędzi</div></section>`;
  }
  druk.innerHTML = html;
}

document.fonts.ready.then(() => {
  const male = dopasuj(document);
  const uwagi = sprawdz();
  if (male.size) uwagi.push(`Na kartach ${[...male].join(', ')} tekstu jest dużo i czcionka jest bardzo mała. Skróć pytania albo odpowiedzi.`);
  const warn = document.getElementById('warn');
  warn.hidden = !uwagi.length;
  warn.innerHTML = uwagi.map(esc).join('<br>');
});
</script>
</body>
</html>
